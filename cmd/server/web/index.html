<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matching Engine</title>
<style>
:root{--bg:#0b0e11;--panel:#151a21;--line:#232a33;--text:#e6e8ea;--mute:#8a94a0;--buy:#16c784;--sell:#ea3943;--acc:#f0b90b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace}
header{display:flex;gap:16px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:16px;margin:0;font-weight:600}header .stat{color:var(--mute)}header .stat b{color:var(--text)}
.tabs button{background:none;border:1px solid var(--line);color:var(--mute);padding:6px 10px;border-radius:6px;cursor:pointer;font:inherit}
.tabs button.on{color:var(--acc);border-color:var(--acc)}
main{display:grid;grid-template-columns:1fr 1fr 320px;gap:12px;padding:12px 16px}
@media(max-width:900px){main{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;min-width:0}
.panel h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:0 0 8px}
table{width:100%;border-collapse:collapse}td,th{padding:2px 4px;text-align:right;position:relative}th{color:var(--mute);font-weight:400;font-size:12px}
td:first-child,th:first-child{text-align:left}
.bar{position:absolute;top:1px;bottom:1px;right:0;opacity:.15;z-index:0}td span{position:relative;z-index:1}
.ask{color:var(--sell)}.bid{color:var(--buy)}.spread{text-align:center;color:var(--mute);padding:6px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:4px 0}
form{display:grid;gap:8px}label{color:var(--mute);font-size:12px}input,select{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);padding:8px;border-radius:6px;font:inherit}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{border:0;padding:10px;border-radius:6px;font:inherit;font-weight:600;cursor:pointer;color:#fff}
.btn.buy{background:var(--buy)}.btn.sell{background:var(--sell)}.btn.acc{background:var(--acc);color:#111}
#msg{min-height:18px;color:var(--mute);font-size:12px;word-break:break-word}
#tape{max-height:420px;overflow:auto}
.big{font-size:28px;font-weight:700;color:var(--acc)}.mute{color:var(--mute);font-size:12px}
</style>
</head>
<body>
<header>
  <h1>⚡ Matching Engine</h1>
  <div class="tabs" id="tabs"></div>
  <span class="stat">orders <b id="sOrders">0</b></span>
  <span class="stat">trades <b id="sTrades">0</b></span>
  <span class="stat" id="conn">connecting…</span>
</header>
<main>
  <section class="panel">
    <h2>Order book · price-time priority</h2>
    <table><thead><tr><th>Price</th><th>Size</th><th>Orders</th></tr></thead><tbody id="asks"></tbody></table>
    <div class="spread" id="spread">–</div>
    <table><tbody id="bids"></tbody></table>
  </section>
  <section class="panel">
    <h2>Trades</h2>
    <div id="tape"><table><thead><tr><th>Time</th><th>Price</th><th>Qty</th></tr></thead><tbody id="trades"></tbody></table></div>
  </section>
  <aside style="display:grid;gap:12px;align-content:start">
    <section class="panel">
      <h2>Place order</h2>
      <form id="f">
        <div class="row">
          <div><label>Type</label><select id="type"><option value="limit">Limit</option><option value="market">Market</option></select></div>
          <div><label>Qty</label><input id="qty" type="number" min="1" value="10"></div>
        </div>
        <div><label>Price (USD)</label><input id="price" type="number" step="0.01"></div>
        <div class="row">
          <button class="btn buy" type="button" data-side="buy">Buy</button>
          <button class="btn sell" type="button" data-side="sell">Sell</button>
        </div>
        <div id="msg"></div>
      </form>
    </section>
    <section class="panel">
      <h2>Live benchmark</h2>
      <p class="mute">Runs 200,000 synthetic orders through a fresh in-memory book on this server and measures throughput.</p>
      <button class="btn acc" id="bench" style="width:100%">Run benchmark</button>
      <div id="benchOut" style="margin-top:10px"></div>
    </section>
  </aside>
</main>
<script>
const SYMS=["BTC-USD","ETH-USD","SOL-USD"];let sym=SYMS[0],es=null,tape=[];
const $=id=>document.getElementById(id);
const fmt=c=>(c/100).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
function tabs(){$("tabs").innerHTML=SYMS.map(s=>`<button class="${s===sym?"on":""}" data-s="${s}">${s}</button>`).join("");
  $("tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{sym=b.dataset.s;tape=[];$("price").value="";tabs();connect()})}
function renderBook(d){
  const asks=d.asks.slice(0,12).reverse(),bids=d.bids.slice(0,12);
  const mx=Math.max(1,...d.asks.slice(0,12).map(l=>l.qty),...bids.map(l=>l.qty));
  const row=(l,c)=>`<tr class="${c}" data-p="${l.price}"><td><span>${fmt(l.price)}</span></td><td><span>${l.qty}</span><div class="bar" style="width:${l.qty/mx*100}%;background:var(--${c==="ask"?"sell":"buy"})"></div></td><td><span>${l.orders}</span></td></tr>`;
  $("asks").innerHTML=asks.map(l=>row(l,"ask")).join("");$("bids").innerHTML=bids.map(l=>row(l,"bid")).join("");
  const ba=d.asks[0],bb=d.bids[0];
  $("spread").textContent=ba&&bb?`spread ${fmt(ba.price-bb.price)}  ·  mid ${fmt((ba.price+bb.price)/2)}`:"–";
  if(!$("price").value&&bb)$("price").value=(bb.price/100).toFixed(2);
  document.querySelectorAll("tr[data-p]").forEach(r=>r.onclick=()=>$("price").value=(r.dataset.p/100).toFixed(2));
}
function renderTrades(ts){
  const now=new Date().toLocaleTimeString();
  for(const t of ts)tape.unshift({...t,time:now});tape=tape.slice(0,60);
  $("trades").innerHTML=tape.map(t=>`<tr class="${t.taker_side==="buy"?"bid":"ask"}"><td>${t.time}</td><td>${fmt(t.price)}</td><td>${t.qty}</td></tr>`).join("");
}
async function connect(){
  if(es)es.close();
  const d=await fetch(`/api/depth/${sym}`).then(r=>r.json());renderBook(d);
  es=new EventSource(`/api/stream/${sym}`);
  es.onopen=()=>$("conn").textContent="● live";es.onerror=()=>$("conn").textContent="reconnecting…";
  es.onmessage=e=>{const ev=JSON.parse(e.data);renderBook(ev.depth);if(ev.trades&&ev.trades.length)renderTrades(ev.trades)};
}
document.querySelectorAll("[data-side]").forEach(b=>b.onclick=async()=>{
  const body={symbol:sym,side:b.dataset.side,type:$("type").value,qty:+$("qty").value,price:Math.round(+$("price").value*100)};
  const r=await fetch("/api/orders",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});const j=await r.json();
  $("msg").textContent=r.ok?`#${j.order_id} ${body.side} ${body.qty}: filled ${j.filled}${j.resting?", rest on book":""} (${j.trades.length} trades)`:`error: ${j.error}`;
});
$("bench").onclick=async()=>{
  $("bench").disabled=true;$("benchOut").innerHTML='<span class="mute">running…</span>';
  const r=await fetch("/api/benchmark?n=200000",{method:"POST"});const j=await r.json();$("bench").disabled=false;
  $("benchOut").innerHTML=r.ok?`<div class="big">${j.orders_per_sec.toLocaleString()}</div><div class="mute">orders/sec · ${j.ns_per_order} ns/order<br>${j.orders.toLocaleString()} orders, ${j.trades.toLocaleString()} trades in ${j.elapsed_ms.toFixed(1)} ms · ${j.cpus} vCPU</div>`:`<span class="mute">${j.error}</span>`;
};
setInterval(async()=>{try{const s=await fetch("/api/stats").then(r=>r.json());$("sOrders").textContent=s.orders.toLocaleString();$("sTrades").textContent=s.trades.toLocaleString()}catch{}},2000);
tabs();connect();
</script>
</body>
</html>
